<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Papers map — Weeks 2–7</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f5f5f3; --bg3: #ededea;
  --text: #1a1a18; --text2: #5a5a56; --text3: #9a9a94;
  --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
  --accent: #378ADD;

  /* category colours, harmonised with slides/week3_lecture_notes.html */
  --c-blue:   #0C447C;  --c-blue-bg:   #E6F1FB;  /* 🟦 individual / persona-grounded */
  --c-teal:   #085041;  --c-teal-bg:   #E1F5EE;  /* 🟩 methodology / position */
  --c-amber:  #633806;  --c-amber-bg:  #FAEEDA;  /* 🟨 static behavioral evaluation */
  --c-coral:  #712B13;  --c-coral-bg:  #FAECE7;  /* 🟥 dynamic / repeated games */
  --c-purple: #3C3489;  --c-purple-bg: #EEEDFE;  /* 🟪 fine-tuning */
  --c-brown:  #5A3A1F;  --c-brown-bg:  #EEE5DB;  /* 🟫 multi-agent simulation */
  --c-orange: #8A3F0A;  --c-orange-bg: #FCE7D5;  /* 🟧 LLM-as-expert */
  --c-pink:   #7A2454;  --c-pink-bg:   #F8E3EE;  /* ⬛ RL as designer / mechanism (Weeks 6–7) */
  --c-steel:  #0B5566;  --c-steel-bg:  #E0F0F3;  /* hybrid LLM + optimizer (Week 6) */
  --c-slate:  #45474D;  --c-slate-bg:  #ECECEE;  /* pure RL · classical game (Week 6) */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14140f; --bg2: #1c1c17; --bg3: #232320;
    --text: #ebebe6; --text2: #b3b3ad; --text3: #80807a;
    --border: rgba(255,255,255,0.13); --border2: rgba(255,255,255,0.25);
    --accent: #6BB0F2;
    --c-blue: #B5D4F4;   --c-blue-bg:   #0C447C;
    --c-teal: #9FE1CB;   --c-teal-bg:   #085041;
    --c-amber:#FAC775;   --c-amber-bg:  #633806;
    --c-coral:#F5C4B3;   --c-coral-bg:  #712B13;
    --c-purple:#CECBF6;  --c-purple-bg: #3C3489;
    --c-brown:#D5BC9C;   --c-brown-bg:  #4A2F18;
    --c-orange:#F4B98A;  --c-orange-bg: #6E330C;
    --c-pink: #F2B8D6;   --c-pink-bg:   #5C1A3F;
    --c-steel:#9CD7E4;   --c-steel-bg:  #0B4250;
    --c-slate:#C4C5CB;   --c-slate-bg:  #34353A;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
.wrap { max-width: 1540px; margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.lede { color: var(--text2); font-size: 14px; margin: 0 0 24px; max-width: 880px; }
.section-eyebrow {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text3);
  margin: 28px 0 8px;
}

/* legend */
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  border: 0.5px solid var(--border); border-radius: 7px;
  padding: 10px 14px; background: var(--bg2);
  margin-bottom: 18px; font-size: 12.5px;
}
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.legend .swatch {
  width: 11px; height: 11px; border-radius: 2px; flex: none;
  border: 0.5px solid var(--border2);
}

/* the diagram */
.diagram {
  border: 0.5px solid var(--border); border-radius: 10px;
  background: var(--bg);
  overflow: hidden;
  position: relative;
}
.diagram svg { display: block; width: 100%; height: auto; }

/* paper card text */
.paper-label {
  font-size: 11.5px; font-weight: 600;
}
.paper-sub {
  font-size: 10px; fill: var(--text2);
}
.paper-meta {
  font-size: 9.5px; fill: var(--text3); font-style: italic;
}
.band-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
  fill: var(--text3);
}
.band-sub {
  font-size: 10px; fill: var(--text3);
}
.week-label {
  font-size: 12px; font-weight: 600; fill: var(--text2);
  letter-spacing: 0.05em;
}
.week-date {
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.07em;
  fill: var(--text3);
}
.week-title {
  font-size: 11px; font-weight: 600; fill: var(--text2);
}
.lineage-label {
  font-size: 12px; fill: var(--text); font-weight: 500;
  paint-order: stroke;
  stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round;
}
.thread-label {
  font-size: 11.5px; fill: var(--accent); font-weight: 600;
  paint-order: stroke;
  stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round;
}

.bandline { stroke: var(--border); stroke-width: 0.5; stroke-dasharray: 2 4; }
.weekline { stroke: var(--border); stroke-width: 0.5; }

.lineage { fill: none; stroke: var(--text3); stroke-width: 1; }
.lineage.strong { stroke: var(--text2); stroke-width: 1.4; }
.lineage.dashed { stroke-dasharray: 4 4; }
.thread { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 2 5; opacity: 0.65; }

/* notes */
.notes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
.note {
  border: 0.5px solid var(--border); border-radius: 7px; padding: 12px 14px;
  background: var(--bg2); font-size: 13px;
}
.note h3 { margin: 0 0 6px; font-size: 12.5px; font-weight: 600; }
.note p { margin: 0 0 6px; color: var(--text2); }
.note p:last-child { margin: 0; }
.note code {
  font-size: 12px; background: var(--bg3); padding: 0 4px; border-radius: 3px;
}
@media (max-width: 760px) { .notes { grid-template-columns: 1fr; } }
</style>
</head>
